<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="福祉用具の計画書・記録で使う定型文を、Google日本語入力のユーザー辞書にまとめたもの。">
<title>福祉用具ユーザー辞書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic&family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@700&display=swap">
<style>
/* Layout: one reading column; sticky search + category tabs; entries grouped by 用具/記入欄 with a leading checkbox; a bottom dock holds the selection bar and notices */
:root {
  --bg: #F2F5F6;
  --surface: #FFFFFF;
  --ink: #1C2A30;
  --muted: #5A6A72;
  --line: #D8E1E5;
  --accent: #15627C;
  --on-accent: #FFFFFF;
  --sel: #E6F1F5;
  --add: #8F5400;
  --add-soft: #FFF0D2;
  --fix: #3B6A2B;
  --fix-soft: #E6F2DE;
  --danger: #B3261E;
  --on-danger: #FFFFFF;
  --danger-soft: #FBE9E7;
  --key: #ECF2F4;
  --key-edge: #C3D0D6;
  --meter: #DCE5E9;
  --mark: #FFE49A;
  --dock: #1C2A30;
  --on-dock: #F2F5F6;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-ui: "BIZ UDGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", monospace;
  --font-display: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171A; --surface: #192125; --ink: #E1E9ED; --muted: #98A9B1; --line: #2B373D;
    --accent: #6CBFDC; --on-accent: #0C2530; --sel: #1B3340; --add: #F0B862; --add-soft: #3A2A11;
    --fix: #9BD189; --fix-soft: #1E3218; --danger: #F2958C; --on-danger: #3A0B07; --danger-soft: #3A1714;
    --key: #212C31; --key-edge: #3A4A51; --meter: #2B373D; --mark: #5E4C10; --dock: #E1E9ED; --on-dock: #11171A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171A; --surface: #192125; --ink: #E1E9ED; --muted: #98A9B1; --line: #2B373D;
  --accent: #6CBFDC; --on-accent: #0C2530; --sel: #1B3340; --add: #F0B862; --add-soft: #3A2A11;
  --fix: #9BD189; --fix-soft: #1E3218; --danger: #F2958C; --on-danger: #3A0B07; --danger-soft: #3A1714;
  --key: #212C31; --key-edge: #3A4A51; --meter: #2B373D; --mark: #5E4C10; --dock: #E1E9ED; --on-dock: #11171A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 780px; margin-inline: auto; padding-inline: 16px; padding-block: 20px 56px; }
body.has-dock .wrap { padding-block-end: 150px; }

.intro { display: grid; gap: 14px; }
.intro h1 {
  font-family: var(--font-display); font-weight: 700; margin: 0;
  font-size: clamp(22px, 5.2vw, 28px); letter-spacing: .03em; line-height: 1.35; text-wrap: balance;
}

.export { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.export .btn { flex: none; min-height: 44px; font-size: 15px; padding: 10px 18px; }
.export p { flex: 1 1 100%; margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

.sticky {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); margin-inline: -16px; padding-inline: 16px; padding-block: 12px 10px;
  border-bottom: 1px solid var(--line); margin-top: 14px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px;
}
.sticky > * { min-width: 0; }
.searchrow { display: flex; gap: 8px; align-items: center; }
.searchrow input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; line-height: 1.4;
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink);
}
.searchrow input::placeholder { color: var(--muted); }

.sticky.adding { position: static; }
.addtoggle {
  display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; text-align: left; cursor: pointer;
  font: inherit; font-size: 14px; line-height: 1.4; padding: 8px 12px; border-radius: 10px;
  border: 1px dashed var(--accent); background: var(--surface); color: var(--muted);
}
.addtoggle b { color: var(--accent); font-weight: 700; white-space: nowrap; }
.addform {
  display: grid; gap: 12px; padding: 14px; border: 1px solid var(--accent); border-radius: 12px; background: var(--surface);
}
.addform h2 { margin: 0; font-size: 16px; line-height: 1.4; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.fields .full { grid-column: 1 / -1; }
.field .lab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; min-width: 0; font: inherit; font-size: 16px; line-height: 1.5; padding: 8px 10px;
  border: 1px solid var(--key-edge); border-radius: 8px; background: var(--bg); color: var(--ink);
}
.field textarea { resize: vertical; min-height: 5.2em; }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); }
.fcount { font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.fcount.over { color: var(--danger); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 12px; color: var(--muted); }
.chips span { flex: 1 1 100%; }
.chips button {
  font-family: var(--font-ui); font-size: 13px; line-height: 1.5; padding: 2px 9px; cursor: pointer; color: var(--ink);
  background: var(--key); border: 1px solid var(--key-edge); border-bottom-width: 3px; border-radius: 6px;
}
.chips button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.fnote { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
.ferr { margin: 0; font-size: 13px; line-height: 1.6; color: var(--danger); font-weight: 700; }
.addacts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.addacts .btn { min-height: 42px; padding-inline: 18px; }
.entry.flash { animation: flash 2.6s ease-out; }
@keyframes flash { from { background: var(--add-soft); } to { background: var(--surface); } }
@media (prefers-reduced-motion: reduce) { .entry.flash { animation: none; background: var(--sel); } }

.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: none; font: inherit; font-size: 13px; line-height: 1.4; padding: 6px 12px; cursor: pointer;
  border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap;
}
.tab .n { font-family: var(--font-ui); font-size: 11px; margin-left: 5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tab[aria-selected="true"] .n { color: var(--on-accent); opacity: .85; }
.tab.trash { border-style: dashed; }
.tab.trash[aria-selected="true"] { background: var(--danger); border-color: var(--danger); color: var(--on-danger); border-style: solid; }
.tab.trash[aria-selected="true"] .n { color: var(--on-danger); }
.tabs.searching .tab:not(.trash) { opacity: .45; }

.jump { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.jump::-webkit-scrollbar { display: none; }
.jump button {
  flex: none; font: inherit; font-size: 12px; line-height: 1.4; padding: 3px 9px; cursor: pointer;
  border-radius: 6px; border: 1px dashed var(--key-edge); background: transparent; color: var(--muted); white-space: nowrap;
}

.status { margin: 16px 2px 0; font-size: 13px; color: var(--muted); }
.status b { color: var(--ink); font-family: var(--font-ui); font-weight: 400; font-variant-numeric: tabular-nums; }

.group {
  margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  scroll-margin-top: calc(var(--hdr, 150px) + 12px);
}
.ghead {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 6px 12px;
  padding: 12px 14px 10px; border-bottom: 1px solid var(--line);
}
.gtitle { display: flex; align-items: flex-end; gap: 10px; min-width: 0; }
.ghead .eyebrow { display: block; font-size: 11px; letter-spacing: .08em; color: var(--muted); line-height: 1.4; }
.ghead h2 { margin: 0; font-size: 17px; line-height: 1.45; text-wrap: balance; }
.keys { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.keys .lbl { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
kbd {
  font-family: var(--font-ui); font-size: 13px; line-height: 1.5; color: var(--ink);
  background: var(--key); border: 1px solid var(--key-edge); border-bottom-width: 3px; border-radius: 6px; padding: 1px 8px;
}
.cnt { font-family: var(--font-ui); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ykey {
  display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
  font-family: var(--font-ui); font-size: 13px; line-height: 1.5; color: var(--ink);
  background: var(--key); border: 1px solid var(--key-edge); border-bottom-width: 3px; border-radius: 6px; padding: 1px 7px 1px 8px;
}
.ykey svg { flex: none; width: 12px; height: 12px; color: var(--accent); }
.ykey:hover { border-color: var(--accent); }
.meta .ykey { font-size: 12px; }

.pick { display: none; flex: none; align-items: flex-start; justify-content: center; width: 30px; padding-top: 2px; cursor: pointer; }
body.can-edit .pick { display: flex; }
.pick input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.gtitle .pick { padding-top: 0; align-self: center; }

.entries { list-style: none; margin: 0; padding: 0; }
.entry { display: flex; gap: 4px; padding: 11px 14px 10px; border-top: 1px solid var(--line); }
.entry:first-child { border-top: 0; }
.entry.is-sel { background: var(--sel); }
.entry:last-child.is-sel { border-radius: 0 0 11px 11px; }
.ebody { flex: 1; min-width: 0; }
.txt { margin: 0; font-size: 15px; line-height: 1.8; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 6px; }
.meta kbd { font-size: 12px; }
.len { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-ui); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { width: 44px; height: 4px; border-radius: 2px; background: var(--meter); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.badge { font-size: 11px; line-height: 1.5; padding: 1px 7px; border-radius: 4px; font-weight: 700; letter-spacing: .04em; }
.badge.del { background: var(--danger-soft); color: var(--danger); }
.eacts { display: inline-flex; gap: 6px; margin-left: auto; }
.edit, .copy, .remove, .restore {
  font: inherit; font-size: 12px; line-height: 1.4; padding: 4px 10px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--accent);
}
.remove { color: var(--danger); }
.copy.done { color: var(--fix); border-color: var(--fix); }

/* その場で編集 */
.nm {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 0 2px; margin: 0;
  font: inherit; color: inherit; text-align: left; background: none; border: 0; border-radius: 4px; cursor: pointer;
}
.nm svg { flex: none; width: 13px; height: 13px; color: var(--accent); opacity: .7; }
.nm:hover { background: var(--sel); }
.nm:hover svg { opacity: 1; }
.ghead h2 .nm { font-weight: 700; }
.status .nm { color: var(--ink); }
.inl {
  font: inherit; font-size: 16px; line-height: 1.4; padding: 3px 8px; width: min(100%, 16em);
  border: 1px solid var(--accent); border-radius: 6px; background: var(--surface); color: var(--ink);
}
.ghead h2 .inl { font-weight: 700; }
.keys .inl { width: 11em; font-family: var(--font-ui); }
.txt.can { cursor: text; border-radius: 4px; }
.txt.can:hover { background: var(--sel); }
.entry.editing { background: var(--sel); }
.entry:last-child.editing { border-radius: 0 0 11px 11px; }
.eedit { flex: 1; min-width: 0; display: grid; gap: 10px; }
.eedit textarea {
  width: 100%; min-height: 5.4em; font: inherit; font-size: 16px; line-height: 1.7; padding: 8px 10px;
  border: 1px solid var(--accent); border-radius: 8px; background: var(--surface); color: var(--ink); resize: vertical;
}
.eedit .field input, .eedit .field select { background: var(--surface); }
.ee-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 10px; }
.ee-acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.ee-acts .fcount { margin-right: auto; font-size: 12px; color: var(--muted); }
.ee-acts .btn { min-height: 40px; }
.eedit .ferr { scroll-margin: calc(var(--hdr, 150px) + 12px) 0 110px; }
.eedit .ferr button { margin-left: 10px; font: inherit; font-size: 13px; color: var(--accent); background: transparent; border: 0; padding: 4px 2px; text-decoration: underline; cursor: pointer; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
.empty { margin-top: 18px; padding: 22px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }


.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; pointer-events: none;
  display: grid; justify-items: center; gap: 8px;
  padding-inline: 12px; padding-block: 0 calc(12px + env(safe-area-inset-bottom, 0px));
}
.dock > * { pointer-events: auto; width: min(100%, 756px); }
.toast {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px;
  background: var(--dock); color: var(--on-dock); font-size: 14px; line-height: 1.5;
}
.toast span { flex: 1; min-width: 0; }
.toast button { flex: none; font: inherit; font-size: 13px; font-weight: 700; background: transparent; border: 0; color: var(--on-dock); text-decoration: underline; cursor: pointer; padding: 4px 2px; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(16, 32, 40, .18);
}
.bar.confirm { border-color: var(--danger); }
.bar .msg { flex: 1 1 160px; min-width: 0; font-size: 14px; line-height: 1.5; }
.bar .msg b { font-family: var(--font-ui); font-variant-numeric: tabular-nums; }
.bar .acts { display: flex; gap: 8px; margin-left: auto; }
.btn { font: inherit; font-size: 14px; line-height: 1.4; padding: 8px 14px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.secondary { background: var(--surface); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: var(--on-danger); font-weight: 700; }
.btn.danger-outline { border-color: var(--danger); color: var(--danger); font-weight: 700; }
.btn:disabled { opacity: .5; cursor: progress; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* パソコンなど横に広い画面：横のスペースを使い、文を2列（さらに広い画面では3列）に並べる */
@media (min-width: 960px) {
  .wrap { max-width: 1440px; padding-inline: 24px; }
  .intro { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .sticky { margin-inline: -24px; padding-inline: 24px; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .sticky > .tabs, .sticky > .jump, .sticky.adding > .addwrap { grid-column: 1 / -1; }
  .addtoggle { width: auto; min-height: 44px; padding-inline: 16px; }
  .group { overflow: hidden; }
  .entries { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); }
  .entry { border-top: 0; background: var(--surface); }
  .entry.is-sel, .entry.editing { background: var(--sel); }
  .entry:last-child:nth-child(odd) { grid-column: 1 / -1; }
  /* 単語を追加：分野・小分類・よみを1行に */
  .fields { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .fields > .field.full:has(#fYomi) { grid-column: auto; }
}
@media (min-width: 1680px) {
  .wrap { max-width: 1760px; }
  .entries { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .entry:last-child:nth-child(odd) { grid-column: auto; }
  .entry:last-child:nth-child(3n+1) { grid-column: 1 / -1; }
  .entry:last-child:nth-child(3n+2) { grid-column: span 2; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="intro">
    <h1>福祉用具ユーザー辞書</h1>
    <div class="export" id="exportBox" hidden>
      <button type="button" class="btn primary" id="toTxt">テキストファイルに変換</button>
      <button type="button" class="btn secondary" id="toXlsx">Excelファイルに変換（分野別）</button>
    </div>
  </header>

  <div class="sticky" id="hdr">
    <div class="searchrow">
      <input id="q" type="search" placeholder="文やよみで検索（例：ぐらつき、てすり）" autocomplete="off" aria-label="文やよみで検索">
    </div>
    <div class="addwrap" id="addWrap" hidden>
      <button type="button" class="addtoggle" id="addToggle" aria-expanded="false" aria-controls="addForm"><b>＋ 単語を追加</b></button>
      <form class="addform" id="addForm" hidden novalidate autocomplete="off">
        <h2>単語を追加</h2>
        <div class="fields">
          <label class="field"><span class="lab">分野</span><select id="fCat"></select></label>
          <label class="field"><span class="lab">小分類（用具名など）</span><input id="fSub" list="fSubList" maxlength="30" placeholder="例：手すり"></label>
          <label class="field full"><span class="lab">よみ（ひらがな）</span><input id="fYomi" maxlength="60" placeholder="例：てすりせ" autocapitalize="off" spellcheck="false"></label>
          <div class="chips full" id="fChips" hidden></div>
          <label class="field full"><span class="lab"><span>登録する言葉</span><span class="fcount" id="fCount">0/100字</span></span><textarea id="fText" rows="3" placeholder="変換したときに出したい文や単語（100文字以内）"></textarea></label>
        </div>
        <p class="fnote" id="fNote" hidden></p>
        <p class="ferr" id="fErr" role="alert" hidden></p>
        <div class="addacts">
          <button type="button" class="btn" id="fClose">閉じる</button>
          <button type="button" class="btn primary" id="fGo">追加する</button>
        </div>
      </form>
      <datalist id="fSubList"></datalist>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="分類"></div>
    <div class="jump" id="jump" aria-label="項目へ移動"></div>
  </div>

  <main id="list" aria-live="polite"></main>
  <datalist id="eeSubList"></datalist>
</div>

<div class="dock" id="dock">
  <div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastAct" hidden>元に戻す</button></div>
  <div class="bar" id="bar" hidden>
    <div class="msg" id="barMsg"></div>
    <div class="acts">
      <button type="button" class="btn" id="barCancel">選択を解除</button>
      <button type="button" class="btn danger-outline" id="barGo">削除する</button>
    </div>
  </div>
</div>

<script type="application/json" id="dict-data">{"tabs":[{"id":"sentei","label":"選定理由"},{"id":"teian","label":"提案理由"},{"id":"ryuui","label":"留意事項"},{"id":"kaigi","label":"ケアマネージャーとの相談記録"},{"id":"monitor","label":"モニタリング"},{"id":"soudan","label":"相談内容"},{"id":"other","label":"事業所・定型文ほか"}],"rows":[[0,"選定理由","車いす","くるまいすせ","下肢筋力の低下により自力での移動が困難なため、安全かつスムーズな移動手段として車いすを選定しました。",0,"ecaf0115a491a","名詞","選定理由（車いす）"],[0,"選定理由","車いす","くるまいすせ","外出時の歩行に不安があり、転倒リスクの軽減と行動範囲の維持・拡大を図るため、車いすを選定しました。",0,"eac06209faf2c","名詞","選定理由（車いす）"],[0,"選定理由","車いす","くるまいすせ","長距離の歩行が困難なため、安全な移動を確保するとともに介護者の負担を軽減できるよう、車いすを選定しました。",2,"e5751182724b3","名詞","選定理由（車いす）"],[0,"選定理由","車いす","くるまいすせ","上肢の力を活かしてご自身で屋内を移動できるよう、操作しやすい自走用の車いすを選定しました。",1,"e527bfab64e6d","名詞","選定理由（車いす）"],[0,"選定理由","車いす","くるまいすせ","自力での駆動が難しいため、介助者が押しやすく、安全に移動できる介助用の車いすを選定しました。",1,"ef53f0ac4a514","名詞","選定理由（車いす）"],[0,"選定理由","車いす","くるまいすせ","ベッドや便座への移乗を安全かつスムーズに行えるよう、アームサポートやフットサポートの着脱ができる車いすを選定しました。",1,"efd33e5454cb5","名詞","選定理由（車いす）"],[0,"選定理由","車いす","くるまいすせ","通院や買い物の際に車へ積み込んで外出できるよう、軽量で折りたたみのできる車いすを選定しました。",1,"ee8cd1cb1c101","名詞","選定理由（車いす）"],[0,"選定理由","車いす","くるまいすせ","座った姿勢を長く保つことが難しく、姿勢が崩れやすいため、背もたれの角度を調整できるリクライニング式の車いすを選定しました。",1,"e4104c7a9d17e","名詞","選定理由（車いす）"],[0,"選定理由","車いす","くるまいすせ","片麻痺があり、健側の手足で操作して移動できるよう、座面が低く足が床に届きやすい車いすを選定しました。",1,"ef23bf76690f8","名詞","選定理由（車いす）"],[0,"選定理由","車いす","くるまいすせ","自宅の廊下や出入口が狭いため、小回りが利き、住環境に合った幅の車いすを選定しました。",1,"e43ff8c411147","名詞","選定理由（車いす）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","座位保持の安定を図り、長時間の着座による身体の負担や痛み、姿勢の崩れを防ぐため車いす付属品を選定しました。",2,"ec7976e093f13","名詞","選定理由（車いす付属品）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","臀部への圧力を分散して皮膚トラブルや褥瘡のリスクを軽減し、安全かつ安楽に車いすを利用できるよう車いす付属品を選定しました。",2,"e16f0c5a90c92","名詞","選定理由（車いす付属品）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","身体の傾きを補正して適切な座位姿勢を保ち、安全な駆動や食事動作を支援するため車いす付属品を選定しました。",2,"ea0c8d1a34998","名詞","選定理由（車いす付属品）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","座っているうちに前方へずり落ちやすいため、姿勢を安定させ転落を防止できるよう、車いす付属品（クッション）を選定しました。",1,"ed4ce1fcb7cb5","名詞","選定理由（車いす付属品）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","車いすに座ったまま食事や趣味の活動を楽しめるよう、車いす用テーブルを選定しました。",1,"ebd91b7226d52","名詞","選定理由（車いす付属品）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","坂道や長い距離の移動では介助者の負担が大きいため、楽で安全な移動ができるよう電動補助装置を選定しました。",1,"edcf7de52cf1d","名詞","選定理由（車いす付属品）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","握力が弱く、今のブレーキでは操作が難しいため、軽い力でかけられるブレーキを付属品として選定しました。",1,"e0cc43fdf1a28","名詞","選定理由（車いす付属品）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","背中が丸くなり姿勢が崩れやすいため、背もたれに当てて上体を支える車いす用の背クッションを選定しました。",1,"ec19fb8021e2b","名詞","選定理由（車いす付属品）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","自走での移動に強い力が必要で疲れやすいため、こぐ力を補助する電動補助装置を選定しました。",1,"e3da778d456ee","名詞","選定理由（車いす付属品）"],[0,"選定理由","車いす付属品","くるまいすふぞくせ","車いすで過ごす時間が長く、汗による蒸れで皮膚トラブルが起きやすいため、通気性の良いクッションを選定しました。",1,"e35b331d28066","名詞","選定理由（車いす付属品）"],[0,"選定理由","特殊寝台","べっどせ","自力での起き上がりや立ち上がりが困難なため、動作を補助し安全に生活できるよう特殊寝台を選定しました。",0,"eb1709dd77f77","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台","べっどせ","ベッド上での姿勢保持や介護負担の軽減を図り、安全かつ安楽な生活環境を整えるため特殊寝台を選定しました。",2,"ec422457f36a5","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台","べっどせ","身体状況に合わせた高さ調整を行うことで、転倒を予防し、安全な移乗動作を支援するため特殊寝台を選定しました。",0,"e28cadd704bfb","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台","べっどせ","背上げ機能を使うことで、ベッド上での食事や水分補給を安全な姿勢で行えるよう特殊寝台を選定しました。",1,"ec2d9873ca212","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台","べっどせ","ベッドの高さを介助しやすい位置に調整でき、おむつ交換や体位変換の際のご家族の腰への負担を軽減できるため特殊寝台を選定しました。",1,"ef2635cab65a3","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台","べっどせ","布団からの起き上がりや立ち上がりの負担が大きいため、ベッドでの生活に切り替え、起居動作を楽に行えるよう特殊寝台を選定しました。",1,"e5fb100bfa3a8","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台","べっどせ","背上げの際に身体が足元へずれやすいため、膝上げ機能でずれを防ぎ、安定した姿勢を保てるよう特殊寝台を選定しました。",1,"e03d5fca92600","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台","べっどせ","ベッドから転落するおそれがあるため、床面近くまで低くでき、転落時の衝撃を抑えられる特殊寝台を選定しました。",1,"ef40a95c2f7ff","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台","べっどせ","背上げ・膝上げ・高さ調整をそれぞれ操作でき、起き上がりや介助など場面に合わせて使い分けられる特殊寝台を選定しました。",1,"eef65fae75344","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台","べっどせ","寝返りや起き上がりの際につかまる所が必要なため、介助バーを取り付けられる特殊寝台を選定しました。",1,"e23bc80d4ccb5","名詞","選定理由（特殊寝台）"],[0,"選定理由","特殊寝台付属品","べっどふぞくせ","ベッドからの転落を防ぎ、立ち上がり動作の支えとして安全を確保するため特殊寝台付属品を選定しました。",2,"e8c9859f5834e","名詞","選定理由（特殊寝台付属品）"],[0,"選定理由 ）"],[0,"選定理由","床ずれ防止用具","とこずれせ","以前に床ずれができたことがあり、再発を防ぐため、体圧分散に優れた床ずれ防止用具を選定しました。",1,"ef08c93733215","名詞","選定理由（床ずれ防止用具）"],[0,"選定理由","床ずれ防止用具","とこずれせ","背上げをして過ごす時間が長く、お尻に体圧が集中しやすいため、背上げ時の底付きを防げるエアマットレスを選定しました。",1,"efed58fd914c4","名詞","選定理由（床ずれ防止用具）"],[0,"選定理由","床ずれ防止用具","とこずれせ","ご自身で寝返りや起き上がりができるため、身体が沈み込みすぎず動きやすいウレタン製の床ずれ防止用具を選定しました。",1,"e7e8e5c4de837","名詞","選定理由（床ずれ防止用具）"],[0,"選定理由","体位変換器","たいいへんかんきせ","自力での体位変換が困難なため、身体にかかる圧力を分散し、皮膚トラブルを予防できるよう体位変換器を選定しました。",2,"ef7a47616b17f","名詞","選定理由（体位変換器）"],[0,"選定理由","体位変換器","たいいへんかんきせ","安楽な姿勢を保ち、長時間の同一姿勢による負担を軽減して安全に過ごせるよう体位変換器を選定しました。",2,"e25d013cb5071","名詞","選定理由（体位変換器）"],[0,"選定理由","体位変換器","たいいへんかんきせ","ベッド上での適切な姿勢管理を行い、褥瘡等のリスクを軽減して安全を確保するため体位変換器を選定しました。",2,"ebea35f8f9af9","名詞","選定理由（体位変換器）"],[0,"選定理由","体位変換器","たいいへんかんきせ","ご家族による体位変換の負担が大きいため、少ない力で身体の向きを変えられるよう体位変換器を選定しました。",1,"e2aad9e78a5e2","名詞","選定理由（体位変換器）"],[0,"選定理由","体位変換器","たいいへんかんきせ","関節が硬く自力で寝返りを打つことが難しいため、無理なく側臥位へ体位を変換できるよう体位変換器を選定しました。",1,"ec9176256e8f6","名詞","選定理由（体位変換器）"],[0,"選定理由","体位変換器","たいいへんかんきせ","体位変換の際に身体を引きずることで生じる皮膚のずれや摩擦を防ぎ、安全に向きを変えられるよう体位変換器を選定しました。",1,"e115b7d117820","名詞","選定理由（体位変換器）"],[0,"選定理由","体位変換器","たいいへんかんきせ","仰向けからの起き上がりを補助し、座った姿勢へ楽に体位を変えられるよう体位変換器を選定しました。",1,"e8c1f735c9dd4","名詞","選定理由（体位変換器）"],[0,"選定理由","体位変換器","たいいへんかんきせ","おむつ交換の際に横向きへ体位を変えて保つことが難しいため、向きを変えやすく介助しやすい体位変換器を選定しました。",1,"e6c5f7349afcf","名詞","選定理由（体位変換器）"],[0,"選定理由","体位変換器","たいいへんかんきせ","横向きの姿勢で過ごすと呼吸が楽になるため、無理なく横向きへ体位を変えられるよう体位変換器を選定しました。",1,"e106fa95f499c","名詞","選定理由（体位変換器）"],[0,"選定理由","体位変換器","たいいへんかんきせ","ベッド上で身体が足元へずり下がりやすく、上へ戻す介助の負担が大きいため、少ない力で身体を移動できる体位変換器を選定しました。",1,"ec365d3135b25","名詞","選定理由（体位変換器）"],[0,"選定理由","手すり","てすりせ","立ち上がりや歩行時のふらつきを抑え、転倒を防止し安全に移動できるよう手すりを選定しました。",0,"e83c194de14a7","名詞","選定理由（手すり）"],[0,"選定理由","手すり","てすりせ","移動経路の安定性を確保し、身体への負担を軽減しながら自立した動作を支援するため手すりを選定しました。",0,"ee556bc984cd9","名詞","選定理由（手すり）"],[0,"選定理由","手すり","てすりせ","バランスを崩しやすい箇所に支持点を設け、日常生活の安全性を高めるため手すりを選定しました。",2,"e6ca86676f08e","名詞","選定理由（手すり）"],[0,"選定理由","手すり","てすりせ","起居動作が不安定なため、楽に立ち上がれて転倒を予防できる かるのを控えていたため、安心して入浴できるよう浴槽台を提案しました。",1,"ed1c09c2005b0","名詞","提案理由（浴槽台）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","浴槽をまたぐ際にふらつきがあり、つかまる所がないため、浴槽の縁に取り付ける浴槽手すりを提案しました。",1,"ebb405ef5af6b","名詞","提案理由（浴槽手すり）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","賃貸住宅で浴室の工事ができないため、浴槽の縁に挟んで固定する浴槽手すりを提案しました。",1,"ebeae9cb91843","名詞","提案理由（浴槽手すり）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","浴槽の縁の形や厚みを確認し、しっかり固定できる浴槽手すりを提案しました。",1,"ed86b956ea8af","名詞","提案理由（浴槽手すり）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","麻痺のない側の手でつかまれるよう、取り付ける向きと位置を確認したうえで浴槽手すりを提案しました。",1,"e5fd0d3f3fd44","名詞","提案理由（浴槽手すり）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","浴槽手すりは購入費の支給を受けて購入できることをご説明し、ご家族とも相談のうえ購入を提案しました。",1,"e2b2f21aa3ed5","名詞","提案理由（浴槽手すり）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","試しに取り付けて浴槽の出入りをしていただいたところ、動作が安定したため、利用を提案しました。",1,"e6ee5d66d8f41","名詞","提案理由（浴槽手すり）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","ご家族の見守りなしで入浴することがあるため、一人でも安全に出入りできるよう浴槽手すりを提案しました。",1,"e7031dc0fd4c5","名詞","提案理由（浴槽手すり）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","浴槽の縁が低く、立ち上がる際に前かがみになりすぎるため、高い位置でつかまれる浴槽手すりを提案しました。",1,"ea30a23b3c5d6","名詞","提案理由（浴槽手すり）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","退院前に浴室の環境を確認し、退院後すぐに安全に入浴できるよう浴槽手すりの設置を提案しました。",1,"e2bdc631faf90","名詞","提案理由（浴槽手すり）"],[1,"提案理由","浴槽手すり","よくそうてすりていあん","入浴時の転倒を心配して入浴の回数が減っていたため、浴槽の出入りを支える浴槽手すりを提案しました。",1,"ec80bd03e4c2f","名詞","提案理由（浴槽手すり）"],[2,"留意事項","車いす","くるまいすりゅ","（車いす）ブレーキの効きやタイヤの空気圧・摩耗は、モニタリング時に担当者が点検します。ブレーキが効きにくい等の異常を感じた際は、担当者までご連絡ください。",2,"ea37e0e6455e2","名詞","留意事項（車いす）"],[2,"留意事項","車いす","くるまいすりゅ","（車いす）移動の際は、足をフットサポートにしっかり乗せ、衣服やひざ掛けが車輪に巻き込まれないようご注意ください。",2,"ec9dc84c0c77f","名詞","留意事項（車いす）"],[2,"留意事項","車いす","くるまいすりゅ","（車いす）乗り降りの際は必ずブレーキをかけてください。段差の昇り降りは無理な姿勢で操作せず、周囲の安全を確かめてゆっくり行ってください。",2,"e9de451824358","名詞","留意事項（車いす）"],[2,"留意事項","車いす","くるまいすりゅ","（車いす）坂道ではスピードが出やすいため、介助者が車いすをしっかり支え、下り坂は後ろ向きでゆっくり進んでください。",1,"e7b91b563f1c6","名詞","留意事項（車いす）"],[2,"留意事項","車いす","くるまいすりゅ","（車いす）折りたたむ際や広げる際は、指を挟まないようご注意ください。",1,"e08e3029ffe5b","名詞","留意事項（車いす）"],[2,"留意事項","車いす","くるまいすりゅ","（車いす）身体状況の変化などで座りにくさや操作しにくさを感じた際は、調整や機種の変更を検討しますので、担当者までご相談ください。",1,"eb08d23f270f2","名詞","留意事項（車いす）"],[2,"留意事項","車いす付属品","くるまいすふぞくりゅ","（車いす付属品）クッションの向きやずれは、モニタリング時に担当者が確認します。座りにくさや姿勢の崩れを感じた際は、担当者までご連絡ください。",2,"e198489a83910","名詞","留意事項（車いす付属品）"],[2,"留意事項","車いす付属品","くるまいすふぞくりゅ","（車いす付属品）カバーの汚れや破れ、滑り止めの劣化はモニタリング時に点検します。汚れや破れが目立つ際は交換しますので、担当者までご連絡ください。",2,"e81c596ef60c4","名詞","留意事項（車いす付属品）"],[2,"留意事項","車いす付属品","くるまいすふぞくりゅ","（車いす付属品）長時間同じ姿勢で座り続けないよう、時々お尻を浮かせるなどしてください。お尻の赤みや痛みがある際は、担当者までご相談ください。",2,"e4a91a8098bfd","名詞","留意事項（車いす付属品）"],[2,"留意事項","車いす付属品","くるまいすふぞくりゅ","（車いす付属品）クッションを洗濯機や乾燥機にかけると素材が傷むおそれがあります。汚れた際は、担当者までご相談ください。",1,"efc2f0db3bc56","名詞","留意事項（車いす付属品）"],[2,"留意事項","車いす付属品","くるまいすふぞくりゅ","（車いす付属品）車いす用テーブルに強く寄りかかったり、体重をかけたりしないようご注意ください。",1,"e813e074e0f7c","名詞","留意事項（車いす付属品）"],[2,"留意事項","車いす付属品","くるまいすふぞくりゅ","（車いす付属品）電動補助装置は、使用前にバッテリーの残量をご確認ください。充電や操作で分からない点は、担当者までご連絡ください。",1,"e2829a975a66a","名詞","留意事項（車いす付属品）"],[2,"留意事項","特殊寝台","べっどりゅ","（特殊寝台）モーターの異音やサイドレールの固定、各部のガタつきは、モニタリング時に担当者が点検します。動作の不具合や異音があれば、担当者までご連絡ください。",2,"e06e3c47954f5","名詞","留意事項（特殊寝台）"],[2,"留意事項","特殊寝台","べっどりゅ","（特殊寝台）リモコンで操作する際は、ベッドの下や周りに人・物・電源コードがないことを確かめてから操作してください。",2,"e85f413bbb55d","名詞","留意事項（特殊寝台）"],[2,"留意事項","特殊寝台","べっどりゅ","（特殊寝台）背上げや高さ調整の際は、手足や頭がサイドレールやベッドの隙間に挟まれないよう、十分ご注意ください。",2,"e6f807c2328e7","名詞","留意事項（特殊寝台）"],[2,"留意事項","特殊寝台","べっどりゅ","（特殊寝台）リモコンは決まった場所に置き、誤って操作したり、ベッド柵の間に挟み込んだりしないようご注意ください。",1,"e00d61a97d9c3","名詞","留意事項（特殊寝台）"],[2,"留意事項","特殊寝台","べっどりゅ","（特殊寝台）ベッドを動かす際は、電源コードを抜いてから移動し、移動後は必ずキャスターのロックをかけてください。",1,"edbdcf26935ea","名詞","留意事項（特殊寝台）"],[2,"留意事項","特殊寝台","べっどりゅ","（特殊寝台）停電や故障でベッドが動かなくなった際は、無理に動かさず、担当者までご連絡ください。",1,"e1b97a1be3b3d","名詞","留意事項（特殊寝台）"],[2,"留意事項","特殊寝台付属品","べっどふぞくりゅ","（特殊寝台付属品）サイドレールや介助バーの固定状態は、モニタリング時に担当者が点検します。ぐらつきを感じた際は使用を中止し、担当者までご連絡ください。",2,"ec9d18890900f","名詞","留意事項（特殊寝台付属品）"],[2,"留意事項","特殊寝台付属品","べっどふぞくりゅ","（特殊寝台付属品）マットレスとサイドレールの間などの隙間に、手足が挟まれないよう十分ご注意ください。",2,"e7093c054f7d4","名詞","留意事項（特殊寝台付属品）"],[2,"留意事項","特殊寝台付属品","べっどふぞくりゅ","（特殊寝台付属品）介助バーなどの可動部分に無理な力をかけないようご注意ください。変形や緩みはモニタリング時に担当者が点検します。",2,"ec72b5301383d","名詞","留意事項（特殊寝台付属品）"],[2,"留意事項",   function buildDictWorkbook(ExcelJS, rows, meta) {
    var FONT = '游ゴシック';
    var ACCENT = 'FF15627C', WHITE = 'FFFFFFFF', SUBFILL = 'FFEEF4F6', LINE = 'FFC8D3D8', MUTED = 'FF5A6A72';
    var thin = { style: 'thin', color: { argb: LINE } };
    var BORDER = { top: thin, left: thin, bottom: thin, right: thin };

    function sheetName(s) { return s.replace(/[\[\]:*?\/\\]/g, '・').slice(0, 31); }
    function units(s) {
      var u = 0;
      Array.from(s).forEach(function (ch) { u += /[\u0000-ÿ｡-ﾟ]/.test(ch) ? 1 : 2; });
      return u;
    }
    function lines(s, width) { return Math.max(1, Math.ceil(units(s) / Math.max(width - 2, 4))); }
    function headCell(c) {
      c.font = { name: FONT, size: 10, bold: true, color: { argb: WHITE } };
      c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: ACCENT } };
      c.alignment = { horizontal: 'center', vertical: 'middle' };
      c.border = BORDER;
    }

    var wb = new ExcelJS.Workbook();
    wb.creator = '福祉用具ユーザー辞書';
    wb.created = new Date();
    wb.calcProperties.fullCalcOnLoad = true;

    var cats = [], byCat = {};
    rows.forEach(function (r) {
      if (!byCat[r[1]]) { byCat[r[1]] = []; cats.push(r[1]); }
      byCat[r[1]].push(r);
    });

    // まとめ（目次）
    var top = wb.addWorksheet('まとめ', { views: [{ showGridLines: false }] });
    top.columns = [{ width: 3 }, { width: 34 }, { width: 10 }];
    top.getCell('B2').value = '福祉用具ユーザー辞書（分野別）';
    top.getCell('B2').font = { name: FONT, size: 16, bold: true };
    top.getCell('B3').value = '作成日：' + meta.date + '　登録数：' + rows.length + '件';
    top.getCell('B3').font = { name: FONT, size: 10, color: { argb: MUTED } };
    var head = top.getRow(5);
    ['分野（シート）', '件数'].forEach(function (h, i) {
      var c = head.getCell(i + 2);
      c.value = h;
      headCell(c);
    });
    cats.forEach(function (cat, i) {
      var row = top.getRow(6 + i);
      row.getCell(2).value = { text: cat, hyperlink: "#'" + sheetName(cat) + "'!A1" };
      row.getCell(2).font = { name: FONT, size: 10.5, color: { argb: ACCENT }, underline: true };
      row.getCell(3).value = byCat[cat].length;
      row.getCell(3).font = { name: FONT, size: 10.5 };
      row.getCell(3).alignment = { horizontal: 'center' };
      row.getCell(2).border = BORDER;
      row.getCell(3).border = BORDER;
    });
    var total = top.getRow(6 + cats.length);
    total.getCell(2).value = '合計';
    total.getCell(3).value = rows.length;
    [2, 3].forEach(function (k) {
      var c = total.getCell(k);
      c.font = { name: FONT, size: 10.5, bold: true };
      c.border = BORDER;
      if (k > 2) c.alignment = { horizontal: 'center' };
    });

    // 分野ごとのシート
    var COLS = [
      { header: 'No.', width: 6 },
      { header: '小分類', width: 18 },
      { header: 'よみ', width: 18 },
      { header: '登録する言葉', width: 70 },
      { header: '品詞', width: 9 },
      { header: '文字数', width: 8 }
    ];
    cats.forEach(function (cat) {
      var ws = wb.addWorksheet(sheetName(cat), { views: [{ state: 'frozen', ySplit: 1 }] });
      ws.columns = COLS.map(function (c) { return { header: c.header, width: c.width }; });
      var hr = ws.getRow(1);
      hr.height = 22;
      hr.eachCell(headCell);
      byCat[cat].forEach(function (r, i) {
        var n = Array.from(r[4]).length, rowNo = i + 2;
        var row = ws.getRow(rowNo);
        row.values = [i + 1, r[2], r[3], r[4], r[7], { formula: 'LEN(D' + rowNo + ')', result: n }];
        row.height = Math.max(18, 15.5 * Math.max(lines(r[4], 70), lines(r[2], 18)) + 5);
        row.eachCell({ includeEmpty: true }, function (c, col) {
          c.font = { name: FONT, size: col === 4 ? 10.5 : 10 };
          c.border = BORDER;
          c.alignment = { vertical: 'top', wrapText: col === 2 || col === 4, horizontal: (col === 1 || col >= 5) ? 'center' : 'left' };
          if (col === 2) c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: SUBFILL } };
        });
      });
      ws.autoFilter = { from: 'A1', to: 'F' + (byCat[cat].length + 1) };
    });
    return wb;
  }

  var EXCELJS_URLS = [
    'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js',
    'https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js'
  ];
  var excelLoading = null;
  function loadExcelJS() {
    if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if (excelLoading) return excelLoading;
    excelLoading = new Promise(function (resolve, reject) {
      var i = 0;
      (function next() {
        if (i >= EXCELJS_URLS.length) { excelLoading = null; reject(new Error('load')); return; }
        var sc = document.createElement('script');
        sc.src = EXCELJS_URLS[i++];
        sc.onload = function () { if (window.ExcelJS) resolve(window.ExcelJS); else next(); };
        sc.onerror = function () { sc.remove(); next(); };
        document.head.appendChild(sc);
      })();
    });
    return excelLoading;
  }
  toXlsx.addEventListener('click', function () {
    if (!dl || saving) return;
    var kept = keptRows(), label = toXlsx.textContent;
    saving = true; toXlsx.disabled = toTxt.disabled = true; toXlsx.textContent = '作成中…';
    loadExcelJS().then(function (ExcelJS) {
      var wb = buildDictWorkbook(ExcelJS, kept, { date: ymd('/') });
      return wb.xlsx.writeBuffer();
    }, function () {
      throw { code: 'lib_failed' };
    }).then(function (buf) {
      var blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      return dl.save({ filename: 'ユーザー辞書_福祉用具_分野別_' + ymd('') + '.xlsx', data: blob });
    }).then(function () {
      showToast(savedMsg(kept.length, 'Excelファイル'));
    }, function (e) {
      var c = e && e.code;
      if (c === 'lib_failed') showToast('Excelを作るための部品を読み込めませんでした。インターネットにつながっているか確認して、もう一度押してください。');
      else if (c === 'declined') showToast('保存を取りやめました。');
      else if (c === 'rate_limited') showToast('保存の確認がすでに開いています。少し待ってから、もう一度押してください。');
      else if (c === 'extension_not_enabled') showToast('この画面ではExcel形式で保存できません。テキストファイルをお使いください。');
      else showToast('Excelファイルを保存できませんでした。');
    }).then(function () {
      saving = false; toXlsx.disabled = toTxt.disabled = false; toXlsx.textContent = label;
    });
  });

  // ---- 保存先
  function pick(obj, ok) {
    var out = {};
    if (obj && typeof obj === 'object') Object.keys(obj).forEach(function (k) { if (ok(obj[k], k)) out[k] = obj[k]; });
    return out;
  }
  function okDeleted(v) { return !!v && typeof v === 'object'; }
  function okWord(w) {
    return !!w && typeof w.y === 'string' && typeof w.t === 'string' && typeof w.c === 'string' && !!(w.y && w.t && w.c) &&
      (w.s === undefined || typeof w.s === 'string') && !BAD.test(w.y + w.t + w.c + (w.s || '')) && !textError(w.t, true);
  }
  function okEdit(e) {
    if (!e || typeof e !== 'object') return false;
    if (e.y !== undefined && (typeof e.y !== 'string' || yomiError(e.y))) return false;
    if (e.t !== undefined && (typeof e.t !== 'string' || BAD.test(e.t) || textError(e.t, true))) return false;
    if (e.c !== undefined && (typeof e.c !== 'string' || !CATTAB.hasOwnProperty(e.c))) return false;
    if (e.s !== undefined && (typeof e.s !== 'string' || !e.s || BAD.test(e.s) || chars(e.s) > 30)) return false;
    return !!(e.y || e.t || e.c || e.s);
  }
  function okName(v, k) { return /^[cst]:/.test(k) && typeof v === 'string' && !!v && !BAD.test(v) && chars(v) <= 30; }

  // ブラウザで開いたとき：この端末（ブラウザ）に保存する
  function localStore() {
    var KEY = 'fukushi-dict:data:v1';
    function load() {
      var d = null;
      try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
      d = d || {};
      deleted = pick(d.deleted, okDeleted); words = pick(d.words, okWord); edits = pick(d.edits, okEdit); names = pick(d.names, okName);
    }
    function persist() {
      try {
        localStorage.setItem(KEY, JSON.stringify({ v: 1, deleted: deleted, words: words, edits: edits, names: names }));
        return Promise.resolve();
      } catch (e) { return Promise.reject({ code: 'local_failed' }); }
    }
    load();
    window.addEventListener('storage', function (e) { if (e.key === KEY) { load(); rebuild(); requestRender(); } });
    return { saveMap: persist, saveDocs: persist };
  }
  // claude.ai で開いたとき：ページのデータベースに保存する（共有した人にも同じ内容が見える）
  function dbStore(db) {
    var maps = {
      deleted: { ref: db.doc('state/deleted'), field: 'deleted', exists: false, get: function () { return deleted; } },
      names: { ref: db.doc('state/names'), field: 'map', exists: false, get: function () { return names; } }
    };
    var cols = { word: db.collection('words'), edit: db.collection('edits') };
    function saveMap(kind, changes) {
      var m = maps[kind], p, body = {};
      if (m.exists) {
        body[m.field] = changes;
        p = m.ref.update(body);
      } else {
        var full = {}, cur = m.get();
        Object.keys(cur).forEach(function (k) { full[k] = cur[k]; });
        Object.keys(changes).forEach(function (k) { if (changes[k]) full[k] = changes[k]; else delete full[k]; });
        body[m.field] = full;
        p = m.ref.set(body);
      }
      return p.then(function () { m.exists = true; }, function (e) {
        if (e && e.code === 'invalid_argument' && m.exists) { m.exists = false; return saveMap(kind, changes); }
        throw e;
      });
    }
    function saveDocs(kind, changes) {
      return Promise.all(Object.keys(changes).map(function (id) {
        var ref = cols[kind].doc(id);
        return changes[id] ? ref.set(changes[id]) : ref.delete();
      }));
    }
    function docsOf(snap, ok) {
      var out = {};
      snap.docs.forEach(function (d) { var x = d.data(); if (ok(x)) out[d.id] = x; });
      return out;
    }
    maps.deleted.ref.onSnapshot(function (snap) {
      maps.deleted.exists = snap.exists;
      deleted = pick(snap.exists ? snap.data().deleted : null, function (v) { return !!v; });
      selected.forEach(function (id) { if (inTrash() ? !deleted[id] : deleted[id]) selected.delete(id); });
      requestRender();
    }, function () { showToast('削除の状態を読み込めませんでした。ページを開き直してください。'); });
    maps.names.ref.onSnapshot(function (snap) {
      maps.names.exists = snap.exists;
      names = pick(snap.exists ? snap.data().map : null, okName);
      rebuild(); requestRender();
    }, function () { showToast('名前の変更を読み込めませんでした。ページを開き直してください。'); });
    cols.word.limit(1000).onSnapshot(function (snap) {
      words = docsOf(snap, okWord);
      rebuild(); requestRender();
    }, function () { showToast('追加した言葉を読み込めませんでした。ページを開き直してください。'); });
    cols.edit.limit(1000).onSnapshot(function (snap) {
      edits = docsOf(snap, okEdit);
      rebuild(); requestRender();
    }, function () { showToast('書き換えた文を読み込めませんでした。ページを開き直してください。'); });
    return { saveMap: saveMap, saveDocs: saveDocs };
  }
  // ブラウザのダウンロードで保存する
  function browserSave(req) {
    try {
      var blob = req.data instanceof Blob ? req.data : new Blob([req.data], { type: 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = req.filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      return Promise.resolve({ status: 'saved' });
    } catch (e) { return Promise.reject({ code: 'unavailable' }); }
  }

  var C = window.claude;
  if (C && typeof C.use === 'function') {
    rebuild(); render();
    C.use('downloads').then(function (d) { dl = d; exportBox.hidden = !d; }, function () {});
    Promise.all([C.use('db'), C.use('user').catch(function () { return null; })]).then(function (res) {
      var db = res[0], user = res[1];
      if (!db) return;
      S = dbStore(db);
      var canWrite = user ? user.can('data.write') : Promise.resolve(null);
      return Promise.resolve(canWrite).then(function (w) {
        if (w !== false) setEditable(true);
        requestRender();
      });
    }).catch(function () {});
  } else {
    local = true;
    S = localStore();
    dl = { save: browserSave };
    exportBox.hidden = false;
    rebuild();
    setEditable(true);
    render();
  }
})();
</script>
</body>
